name: ft-transcendence-prod

networks:
  prod-private:
    driver: bridge
    internal: true
  prod-public:
    driver: bridge

volumes:
  redis_data: {}
  frontend_dist: {}

# YAML anchor
x-logstash-logging: &logstash-logging
  driver: gelf
  options:
    gelf-address: udp://localhost:12201

services:

  # Backend
  # Needs outbound internet access to send confirmation mails, hence prod-public
  backend:
    build:
      context: .
      dockerfile: ./node.template.dockerfile
      args:
        SERVICE_NAME: api
        SERVICE_DIR: backend
    image: ft-transcendence-backend-prod:latest
    init: true
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      - prod-public
      - prod-private
    volumes:
      - ./apps/backend/data/sqlite:/data
      - ./apps/backend/data/sqlite/uploads:/data/uploads
    logging: *logstash-logging

  # Frontend builds the site and then exits
  frontend-builder:
    build:
      context: .
      dockerfile: ./apps/frontend/prod.dockerfile
    image: ft-transcendence-frontend-builder:latest
    volumes:
      - .:/work:cached
      - frontend_dist:/work/apps/frontend/dist
    networks:
      - prod-private
    logging: *logstash-logging

  # Nginx gateway (public entrypoint)
  nginx:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      game-server:
        condition: service_started
      frontend-builder:
        condition: service_completed_successfully
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - prod-public
      - prod-private
    logging: *logstash-logging

  # Matchmaking service
  # TODO: depends on Redis?
  matchmaking-service:
    build:
      context: .
      dockerfile: ./node.template.dockerfile
      args:
        SERVICE_NAME: matchmaking
        SERVICE_DIR: matchmaking
    image: ft-transcendence-matchmaking-prod:latest
    init: true
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      - prod-private
    depends_on:
      - allocator
    logging: *logstash-logging

  # Game server(s)
  # TODO: depends on Redis?
  game-server: &game-server-template
    build:
      context: .
      dockerfile: ./node.template.dockerfile
      args:
        SERVICE_NAME: game-server
        SERVICE_DIR: game-server
    image: ft-transcendence-game-server-prod:latest
    init: true
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      - prod-private
    logging: *logstash-logging

  # 6b) Game server 2
  game-server-2:
    <<: *game-server-template

  # Allocator
  allocator:
    build:
      context: .
      dockerfile: ./node.template.dockerfile
      args:
        SERVICE_NAME: allocator
        SERVICE_DIR: allocator
    image: ft-transcendence-allocator-prod:latest
    init: true
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
    networks:
      - prod-private
    depends_on:
      - redis
    logging: *logstash-logging

  # Redis
  redis:
    image: redis:8.2.1-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - prod-private
    logging: *logstash-logging

  # Scorer
  scorer:
    build:
      context: .
      dockerfile: ./node.template.dockerfile
      args:
        SERVICE_NAME: scorer
        SERVICE_DIR: scorer
    image: ft-transcendence-scorer-prod:latest
    init: true
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
    networks:
      - prod-private
    depends_on:
      - redis
      - game-server
      - game-server-2
    logging: *logstash-logging

  # Game Gateway
  game-gateway:
    build:
      context: .
      dockerfile: ./node.template.dockerfile
      args:
        SERVICE_NAME: game-gateway
        SERVICE_DIR: game-gateway
    image: ft-transcendence-game-gateway-prod:latest
    init: true
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      - prod-private
    ports:
      - "55550:55550"
    depends_on:
      - redis
    logging: *logstash-logging
