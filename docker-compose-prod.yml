volumes:
  frontend-dist: {}

networks:
  prod-public:
    driver: bridge
  prod-private:
    driver: bridge
    # TODO: for best security, this should be set to true. But that is probably
    # overkill. Then backend containers would have no internet access at all. 
    internal: false

services:
  # 1) Install deps ONCE for the whole repo (root lockfile)
  deps:
    networks:  !override [prod-private]

  builder:
    image: node:22-bookworm
    profiles: ["prod-build"]
    working_dir: /work/apps/frontend
    command: >
      bash -lc "
        corepack pnpm install --frozen-lockfile &&
        corepack pnpm -F @app/web build
      "
    environment:
      PNPM_STORE_DIR: /pnpm/store
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: /tmp/corepack
    depends_on:
      deps:
        condition: service_completed_successfully
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/work:cached
      - frontend-dist:/work/apps/frontend/dist
    networks: [prod-private]
    logging: # needed for logstash (ELK stack)
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

  # 3) Backend (Fastify + tsx watch)
  backend:
    ports: !reset []
    networks:  !override [prod-private]

  # 4) Nginx (single-origin dev, optional but convenient)
  nginx:
    volumes: !override
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
    networks:  !override [prod-public, prod-private]
    # depends_on:
    #   builder:
    #     condition: service_completed_successfully

  # 5) Matchmaking service (WebSocket server)
  matchmaking-service:
    ports: !reset []
    networks:  !override [prod-private]

# 6) Game server (WebSocket server)
  game-server:
    ports: !reset []
    networks: !override [prod-private]

