name: ft-transcendence-prod

networks:
  prod-private:
    driver: bridge
  prod-public:
    driver: bridge

volumes:
  redis_data: {}

services:
  # Backend
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/prod.dockerfile
    image: ft-transcendence-backend:latest
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      - prod-private
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./apps/backend/data/sqlite:/data
      - ./apps/backend/data/sqlite/uploads:/data/uploads
    logging:
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

