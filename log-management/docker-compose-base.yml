networks:
  prod-private:
    driver: bridge
    internal: true
  prod-public:
    driver: bridge

volumes:
  elk_certs:
    driver: local
  elasticsearch_data:
    driver: local
  kibana_data:
    driver: local
  logstash_data:
    driver: local

services:

  elastic_cert_setup:
    build:
      context: ./log-management/elastic_cert_setup/
      args:
        STACK_VERSION: ${ES_STACK_VERSION:-9.1.5}
    volumes:
      - elk_certs:/usr/share/elasticsearch/config/certs
    user: '0'
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', '[ -f config/certs/elasticsearch/elasticsearch.crt ]']
      interval: 1s
      timeout: 5s
      retries: 120
    networks:
      - prod-private

  elasticsearch:
    build:
      context: ./log-management/elasticsearch/
      args:
        STACK_VERSION: ${ES_STACK_VERSION:-9.1.5}
    labels:
      co.elastic.logs/module: elasticsearch
    restart: unless-stopped
    volumes:
      - elk_certs:/usr/share/elasticsearch/config/certs
      - elasticsearch_data:/usr/share/elasticsearch/data
    environment:
      - ELASTIC_USER=${ELASTIC_USER}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256M
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${ES_LICENSE:-basic}
      - bootstrap.memory_lock=false
      - indices.memory.index_buffer_size=10%
    mem_limit: 1536m
    healthcheck:
      test:
        - CMD-SHELL
        - |
          curl -fsSL --cacert config/certs/ca/ca.crt \
          -u ${ELASTIC_USER:-elastic}:${ELASTIC_PASSWORD:-changeme} \
          "https://localhost:${ES_PORT:-9200}/_cluster/health?wait_for_status=yellow&timeout=5s" \
          > /dev/null
      interval: 5s
      timeout: 10s
      retries: 120
    depends_on:
      elastic_cert_setup:
        condition: service_completed_successfully
    networks:
      - prod-private

  # configures policies using the API
  elasticsearch-post:
    build:
      context: ./log-management/elasticsearch-post/
    volumes:
      - elk_certs:/usr/share/elk/config/certs
    environment:
      - ES_URL=https://elasticsearch:${ES_PORT:-9200}
      - ELASTIC_USER=${ELASTIC_USER:-elastic}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
      - DEVELOPER_PASSWORD=${ES_DEVELOPER_PASS:-changeme}
      - ANALYST_PASSWORD=${ES_ANALYST_PASS:-changeme}
    networks:
      - prod-private
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    build:
      context: ./log-management/kibana/
      args:
        STACK_VERSION: ${ES_STACK_VERSION:-9.1.5}
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    labels:
      co.elastic.logs/module: kibana
    volumes:
      - elk_certs:/usr/share/kibana/config/certs
      - kibana_data:/usr/share/kibana/data
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://elasticsearch:${ES_PORT:-9200}
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/ca/ca.crt
      - XPACK_SECURITY_ENCRYPTIONKEY=${ES_ENCRYPTION_KEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${ES_ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${ES_ENCRYPTION_KEY}
      - xpack.security.enabled=true
      - SERVER_BASEPATH=/kibana
      - SERVER_PUBLICBASEURL=http://localhost:${MONITORING_PORT:-8082}/kibana
      - SERVER_REWRITEBASEPATH=true
      - NODE_OPTIONS=--max-old-space-size=500
      - xpack.monitoring.enabled=false
      - xpack.ml.enabled=false
      - xpack.graph.enabled=false
    mem_limit: 1024m
    healthcheck:
      test:
       - CMD-SHELL
       - |
         curl -s http://localhost:${KIBANA_PORT}/api/status | \
         grep -q '\"level\":\"available\"'
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - prod-private
      - prod-public

  kibana-post:
    build:
      context: ./log-management/kibana-post/
    environment:
      - KIBANA_URL=http://kibana:${KIBANA_PORT:-5601}
      - ELASTIC_USER=${ELASTIC_USER:-elastic}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    networks:
      - prod-private
    depends_on:
      kibana:
        condition: service_healthy

  logstash:
    build:
      context: ./log-management/logstash/
      args:
        STACK_VERSION: ${ES_STACK_VERSION:-9.1.5}
    labels:
      co.elastic.logs/module: logstash
    restart: unless-stopped
    volumes:
      - elk_certs:/usr/share/logstash/certs
      - logstash_data:/usr/share/logstash/data
    environment:
      - ELASTIC_USER=${ELASTIC_USER}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - LS_JAVA_OPTS=-Xms256m -Xmx256m -XX:MaxDirectMemorySize=128M
      - xpack.monitoring.enabled=false
      - ELASTIC_HOSTS=https://elasticsearch:${ES_PORT:-9200}
      - ELASTIC_USER=${ELASTIC_USER:-elastic}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9600/_node/stats || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 150
      start_period: 10s
    ports:
      # Listens for GELF input here. The GELF driver can only send to host IPs,
      # not into containers => this port needs to be exposed
      - '12201:12201/udp'
    networks:
      - prod-private
      - prod-public
