name: Syntax Check

on:
  workflow_dispatch:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

concurrency:
  group: syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Setup pnpm 9.12.3
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: true

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm run typecheck
        # root script fans out: "pnpm -r --if-present typecheck"

      - name: Lint (all packages with lint script)
        run: pnpm run lint
        # root script fans out: "pnpm -r --if-present lint"

      - name: Check formatting
        run: pnpm run check-format
        # root script runs Prettier in repo root

      - name: Comment on PR if failed
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request?.number;
            if (!pr) {
              core.info('No PR number found; skipping comment.');
              return;
            }
            const failedSteps = context.runId; // simple link to run
            const body = [
              '**SyntaxCheck CI** failed for the monorepo.',
              `Commit: \`${process.env.GITHUB_SHA.slice(0,7)}\``,
              `Run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body
            });
