name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  backend:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node.js 22.19.0 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: 'pnpm'

      - name: Install dependencies (root)
        run: pnpm install --frozen-lockfile

      - name: Set up .env
        run: cp apps/backend/.env.example apps/backend/.env

      - name: Run typecheck
        run: pnpm -F @app/api typecheck

      # -------------------------------
      # 1️⃣ Run backend server for smoke/integration
      # -------------------------------
      - name: Run backend server
        run: |
          PORT=3001 pnpm -F @app/api dev > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          for i in {1..15}; do
            if curl -s http://localhost:3001/health > /dev/null; then
              echo "Server is up!"
              break
            fi
            sleep 2
          done
          if ! curl -f http://localhost:3001/health > /dev/null; then
            echo "Server failed to start:"
            cat server.log
            kill $SERVER_PID
            exit 1
          fi
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

      # -------------------------------
      # 2️⃣ Run backend tests
      # -------------------------------
      - name: Run backend tests
        run: pnpm -F @app/api test -- --run --reporter=dot

      # -------------------------------
      # 3️⃣ Stop backend server
      # -------------------------------
      - name: Stop backend server
        if: always()
        run: kill $SERVER_PID

      # -------------------------------
      # 📝 Comment in PR on failure
      # -------------------------------
      - name: Comment on PR if failed
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request?.number;
            if (!pr) {
              core.info('No PR number found; skipping comment.');
              return;
            }
            const body = [
              '**Backend CI** failed.',
              `Commit: \`${process.env.GITHUB_SHA.slice(0,7)}\``,
              `Logs: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body
            });

