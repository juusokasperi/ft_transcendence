name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [ main, dev, feat/devops-test ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.19.0 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Install dependencies
        run: npm ci

      - name: Set up .env
        run: cp .env.example .env
      # -------------------------------
      # 1️⃣ Run backend server for smoke/integration
      # -------------------------------
      - name: Run backend server
        run: |
          PORT=3001 npm run dev > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          for i in {1..15}; do
            if curl -s http://localhost:3001/health > /dev/null; then
              echo "Server is up!"
              break
            fi
            sleep 2
          done
          if ! curl -f http://localhost:3001/health > /dev/null; then
            echo "Server failed to start:"
            cat server.log
            kill $SERVER_PID
            exit 1
          fi
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

      # -------------------------------
      # 2️⃣ Run backend tests
      # -------------------------------
      - name: Run backend tests
        run: npm run test -- --run --reporter=dot

      # -------------------------------
      # 3️⃣ Stop backend server
      # -------------------------------
      - name: Stop backend server
        if: always()
        run: kill ${{ env.SERVER_PID }}
