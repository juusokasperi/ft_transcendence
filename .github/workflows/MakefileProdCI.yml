name: Makefile Prod CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up .env
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
            network=host

      # Cache BuildKit build cache (much more efficient than saving image tars)
      - name: Cache BuildKit
        uses: actions/cache@v4
        with:
          path: /tmp/.buildkit-cache
          key: ${{ runner.os }}-buildkit-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json', 'docker-compose-prod.yml', 'node.template.dockerfile', 'apps/frontend/prod.dockerfile', 'nginx/prod.conf.template', '.env.example', 'Makefile', '.config/tsconfig.*.json', 'tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-buildkit-

      - name: Build all services with cache
        run: |
          # Create cache directory structure
          mkdir -p /tmp/.buildkit-cache-new
          
          # Build with BuildKit cache mounts
          CACHE_FROM=""
          CACHE_TO="type=local,dest=/tmp/.buildkit-cache-new,mode=max"
          
          if [ -d "/tmp/.buildkit-cache" ] && [ "$(ls -A /tmp/.buildkit-cache)" ]; then
            echo "Using existing BuildKit cache"
            CACHE_FROM="type=local,src=/tmp/.buildkit-cache"
          else
            echo "No existing cache found, building from scratch"
          fi
          
          make prod-slim-detached \
            BUILDX_CACHE_FROM="$CACHE_FROM" \
            BUILDX_CACHE_TO="$CACHE_TO"
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      # Move new cache into place for next run
      - name: Rotate BuildKit cache
        if: always()
        run: |
          rm -rf /tmp/.buildkit-cache
          if [ -d "/tmp/.buildkit-cache-new" ]; then
            mv /tmp/.buildkit-cache-new /tmp/.buildkit-cache
            echo "BuildKit cache updated"
          fi

      - name: Comment on PR if failed
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request?.number;
            if (!pr) {
              core.info('No PR number found; skipping comment.');
              return;
            }
            const body = [
              '**Makefile Prod CI** failed.',
              `Commit: \`${process.env.GITHUB_SHA.slice(0,7)}\``,
              `Logs: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body
            });
