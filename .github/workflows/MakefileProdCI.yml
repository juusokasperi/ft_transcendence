name: Makefile Prod CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up .env
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
            network=host

      # Cache Docker layers - this caches the final image layers
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json', 'docker-compose-prod.yml', 'node.template.dockerfile', 'apps/frontend/prod.dockerfile', 'nginx/prod.conf.template', '.env.example', 'Makefile', '.config/tsconfig.*.json', 'tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build images with Buildx bake (local cache)
        run: |
          docker buildx bake -f docker-compose-prod.yml \
            --set *.cache-from=type=local,src=/tmp/.buildx-cache \
            --set *.cache-to=type=local,dest=/tmp/.buildx-cache,mode=max \
            --load

      - name: Start prod stack (no build)
        run: docker compose -p ft-transcendence-prod --env-file .env -f docker-compose-prod.yml up -d

      - name: Comment on PR if failed
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request?.number;
            if (!pr) {
              core.info('No PR number found; skipping comment.');
              return;
            }
            const body = [
              '**Makefile Prod CI** failed.',
              `Commit: \`${process.env.GITHUB_SHA.slice(0,7)}\``,
              `Logs: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body
            });
