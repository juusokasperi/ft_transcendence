name: ft-transcendence-prod

volumes:
  pnpm-store: {}
  node_modules: {}
  frontend-dist: {}
  backend-dist: {}
  matchmaking-dist: {}
  game-server-dist: {}

networks:
  prod-public:
    driver: bridge
  prod-private:
    driver: bridge
    # TODO: for best security, this should be set to true. But that is probably
    # overkill. Then backend containers would have no internet access at all. 
    internal: false

services:
  # 1) Builder: compiles everything into dist/
  builder:
    image: node:22-bookworm
    working_dir: /work
    environment:
      PNPM_STORE_DIR: /pnpm/store
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: /tmp/corepack
    command: >
      bash -lc "
        corepack enable &&
        corepack prepare pnpm@9.12.3 --activate &&
        pnpm install --frozen-lockfile &&
        corepack pnpm -F @app/api build &&
        corepack pnpm -F @app/web build &&
        corepack pnpm -F @app/matchmaking build &&
        corepack pnpm -F @app/game-server build &&
        tail -f < /dev/null
      "
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules
      - frontend-dist:/work/apps/frontend/dist
      - backend-dist:/work/apps/backend/dist
      - matchmaking-dist:/work/apps/matchmaking/dist
      - game-server-dist:/work/apps/game-server/dist
    networks: [prod-private]

  # 2) Backend (runs compiled dist)
  backend-prod:
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/backend
    env_file:
      - .env
    command: bash -lc "node dist/index.js"
    depends_on:
      builder:
        condition: service_completed_successfully
    volumes:
      # - .:/work:ro
      - backend-dist:/work/apps/backend/dist:ro
      - ./apps/backend/data/sqlite:/data
      - ./apps/backend/data/sqlite/uploads:/data/uploads
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    networks: [prod-private]

  # 3) Matchmaking service
  matchmaking-service-prod:
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/matchmaking
    env_file:
      - .env
    command: bash -lc "node dist/main.js"
    depends_on:
      builder:
        condition: service_completed_successfully
    volumes:
      # - .:/work:ro
      - matchmaking-dist:/work/apps/matchmaking/dist:ro
    networks: [prod-private]

  # 4) Game server
  game-server-prod:
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/game-server
    env_file:
      - .env
    command: bash -lc "node dist/main.js"
    depends_on:
      builder:
        condition: service_completed_successfully
    volumes:
      # - .:/work:ro
      - game-server-dist:/work/apps/game-server/dist:ro
    networks: [prod-private]

  # 5) Nginx
  nginx-prod:
    image: nginx:1.27-alpine
    depends_on:
      - backend-prod
      - matchmaking-service-prod
      - game-server-prod
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/frontend/dist:/usr/share/nginx/html:ro
    networks: [prod-private, prod-public]

