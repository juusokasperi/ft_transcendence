# /etc/nginx/conf.d/default.conf

resolver 127.0.0.11 ipv6=off valid=30s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  # ---------- API -> backend ----------
  location /api/ {
    set $be http://backend:3001;
    proxy_pass $be;
    proxy_http_version 1.1;

    proxy_set_header Host               $http_host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $http_host;
    proxy_set_header X-Forwarded-Port   $server_port;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;

    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ---------- Static uploads via backend ----------
  location /uploads/ {
    set $be http://backend:3001;
    proxy_pass $be;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
  }

  # ---------- Vite HMR WS ----------
  location /@vite {
    set $fe http://frontend:5173;
    proxy_pass $fe;
    proxy_http_version 1.1;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $http_host;

    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_buffering off;
  }

  # ---------- Everything else -> Vite ----------
  location / {
    set $fe http://frontend:5173;
    proxy_pass $fe;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
  }

  location /g/ {
    set $gw http://game-gateway:55550;
    proxy_pass $gw;
    proxy_http_version 1.1;

    proxy_set_header Host               $host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $http_host;
    proxy_set_header X-Forwarded-Port   $server_port;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;

    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /matchmaking {
    set $mm http://matchmaking-service:4242;
    proxy_pass $mm;
    proxy_http_version 1.1;

    proxy_set_header Host               $http_host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $http_host;
    proxy_set_header X-Forwarded-Port   $server_port;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;

    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /game-server {
    set $gs http://game-server:55553;
    proxy_pass $gs;
    proxy_http_version 1.1;

    proxy_set_header Host               $http_host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $http_host;
    proxy_set_header X-Forwarded-Port   $server_port;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;

    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

  # For nginx-prometheus-exporter (monitoring)
  # TODO: Allow all IPs because only port 80 is exposed to host anyway?
  # That would reduce risk of breakage in case docker decides to use another IP
  # range for the bridge network.
  location /stub_status {
    stub_status;
    allow 172.16.0.0/12;
    deny all;
  }

  location /chat {
    proxy_pass http://chat-service:6262;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

}
