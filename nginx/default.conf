upstream fe { server frontend:5173; }
upstream be { server backend:3001; }

server {
  listen 80;
  server_name _;

  # API to Fastify
  location /api/ {
    proxy_pass http://be;
    proxy_http_version 1.1;
  }

  # Vite HMR websocket
  location /@vite {
    proxy_pass http://fe;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }

  # Everything else -> Vite dev server
  location / {
    proxy_pass http://fe;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
  }
}
