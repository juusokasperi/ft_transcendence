volumes:
  grafana-storage:
    driver: local

# TODO: labels?
services:
  prometheus:
    image: prom/prometheus
    profiles:
      - monitoring
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - devnet
    ports:
      - "9090:9090"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    profiles:
      - monitoring
    command:
      - "-nginx.scrape-uri=http://nginx:80/stub_status"
    networks:
      - devnet
    ports:
      - "9113:9113"

  # TODO: password
  grafana:
    image: grafana/grafana
    profiles:
      - monitoring
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml
    networks:
      - devnet
    ports:
      - "3002:3000"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    profiles:
      - monitoring
    command:
      - "--disable_metrics=disk,percpu,network,memory"
    # privileged: true
    ports:
      - "8090:8080"
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      # - "/sys:/sys:ro"
      # - "/var/lib/docker/:/var/lib/docker:ro"
      # - "/proc:/host/proc:ro"
      # - "/dev/disk/:/dev/disk:ro"
    # devices:
    #   - "/dev/kmsg:/dev/kmsg"
    networks:
      - devnet
