volumes:
  grafana-storage:
    driver: local

# TODO: labels?
services:
  prometheus:
    image: prom/prometheus
    profiles:
      - monitoring
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - prod-private
    ports:
      - '9090:9090'

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    depends_on:
      nginx:
        condition: service_started
    profiles:
      - monitoring
    command:
      - '--nginx.scrape-uri=http://nginx:${NGINX_STUB_STATUS_PORT:-8081}/stub_status'
    networks:
      - prod-private
    ports:
      - '9113:9113'

  grafana:
    image: grafana/grafana
    profiles:
      - monitoring
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASS}
      - GF_SERVER_ROOT_URL=https://localhost:${NGINX_HTTPS_PORT}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_ENABLE_GZIP=true
      - GF_SERVER_ROUTER_LOGGING=true
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml
      - ./grafana/dashboards-nginx.yaml:/etc/grafana/provisioning/dashboards/dashboards-nginx.yaml
      - ./grafana/dashboards/nginx:/etc/grafana/dashboards/nginx
      - ./grafana/dashboards-cadvisor.yaml:/etc/grafana/provisioning/dashboards/dashboards-cadvisor.yaml
      - ./grafana/dashboards/cadvisor:/etc/grafana/dashboards/cadvisor
      - ./grafana/dashboards-node-sqlite.yaml:/etc/grafana/provisioning/dashboards/node-sqlite.yaml
      - ./grafana/dashboards/node-sqlite/:/etc/grafana/dashboards/node-sqlite
    networks:
      - prod-private

  grafana-setup:
    image: alpine:3
    profiles:
      - monitoring
    depends_on:
      - grafana
    volumes:
      - ./grafana-setup/setup.sh:/setup.sh:ro
    environment:
      - GRAFANA_URL=http://grafana:3000
      - ADMIN_USER=${GRAFANA_ADMIN_USER}
      - ADMIN_PASS=${GRAFANA_ADMIN_PASS}
      - NEW_NAME=${GRAFANA_USER_NAME}
      - NEW_LOGIN=${GRAFANA_USER_NAME}
      - NEW_PASS=${GRAFANA_USER_PASS}
    networks:
      - prod-private
      - prod-public #TODO: use dockerfile to install curl, so this not needed?
    entrypoint: ['sh', '/setup.sh']

  # How much cAdvisor can do really depends how much privileges you have
  # on the host. Enabling too many things will fill the logs with spam and
  # eat the CPU.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    profiles:
      - monitoring
    command:
      - '--disable_metrics=cpu_topology,disk,network,memory,memory_numa,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,resctrl,cpuset,advtcp'
      - '--docker_only=true'
      - '--housekeeping_interval=30s'
    cap_add:
      - SYS_PTRACE
    ports:
      - '8090:8080'
    volumes:
      - '/:/rootfs:ro'
      - '/var/run:/var/run:ro'
      - '/sys:/sys:ro'
      - '/sys/fs/cgroup:/sys/fs/cgroup:ro'
      - '/var/lib/docker/:/var/lib/docker:ro'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    networks:
      - prod-private
