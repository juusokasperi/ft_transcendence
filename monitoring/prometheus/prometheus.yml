global:
  scrape_interval: 5s

scrape_configs:

  - job_name: 'node-backend'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/targets.json'

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'game-servers'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['game-server:55554', 'game-server-2:55554']
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        replacement: '${1}:55553'
        target_label: instance
