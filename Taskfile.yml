version: "3"

vars:
  NAME: transcendence
  SERVICES: backend frontend nginx elastic_cert_setup elasticsearch kibana kibana-post logstash

tasks:
  default:
    desc: Default task (runs all)
    cmds:
      - task: all

  all:
    desc: Run docker compose with build
    cmds:
      - mkdir -p ./backend/data/sqlite/uploads
      - docker compose -p {{.NAME}} -f docker-compose.yml --env-file .env up --build

  elk:
    desc: Run docker compose with ELK profile
    cmds:
      - mkdir -p ./backend/data/sqlite/uploads
      - docker compose -p {{.NAME}} -f docker-compose.yml --env-file .env --profile elk up --build

  elk-detached:
    desc: Run docker compose with ELK profile in detached mode
    cmds:
      - mkdir -p ./backend/data/sqlite/uploads
      - docker compose -p {{.NAME}} -f docker-compose.yml --env-file .env --profile elk up --build -d

  detached:
    desc: Run docker compose in detached mode
    cmds:
      - mkdir -p ./backend/data/sqlite/uploads
      - docker compose -p {{.NAME}} -f docker-compose.yml --env-file .env up --build -d

  down:
    desc: Stop and remove containers
    cmds:
      - docker compose -p {{.NAME}} -f docker-compose.yml --env-file .env --profile elk down --remove-orphans

  fclean:
    desc: Remove containers, volumes, and uploads
    cmds:
      - docker compose -p {{.NAME}} -f docker-compose.yml --env-file .env --profile elk down --rmi local --volumes --remove-orphans
      - rm -rf ./backend/data

  re:
    desc: Rebuild project (fclean + all)
    cmds:
      - task: fclean
      - task: all

  ps:
    desc: Show docker compose status
    cmds:
      - docker compose -p {{.NAME}} -f docker-compose.yml ps

  logs:*:
    vars:
      SERVICE: "{{index .MATCH 0}}"
    desc: "Show logs for a service (usage: task logs:service_name)"
    cmds:
      - docker compose -p {{.NAME}} -f docker-compose.yml logs {{.SERVICE | default ""}}

  sh:*:
    vars:
      SERVICE: "{{index .MATCH 0}}"
    desc: "Open sh shell in a service (usage: task sh:service_name)"
    cmds:
      - docker compose -p {{.NAME}} -f docker-compose.yml exec -it {{.SERVICE}} sh

  bash:*:
    vars:
      SERVICE: "{{index .MATCH 0}}"
    desc: "Open bash shell in a service (usage: task bash:service_name)"
    cmds:
      - docker compose -p {{.NAME}} -f docker-compose.yml exec -it {{.SERVICE}} bash

  stop:
    desc: Stop all containers without removing them
    cmds:
      - docker compose -p {{.NAME}} -f docker-compose.yml --profile elk stop

  restart:
    desc: Restart all containers
    cmds:
      - docker compose -p {{.NAME}} -f docker-compose.yml restart

  restart-elk:
    desc: Restart all containers with ELK
    cmds:
      - docker compose -p {{.NAME}} -f docker-compose.yml --profile elk restart

  restart-service:*:
    vars:
      SERVICE: "{{index .MATCH 0}}"
    desc: "Restart a single service (usage: task restart-service -- SERVICE=service_name)"
    cmds:
      - docker compose -p {{.NAME}} -f docker-compose.yml restart {{.SERVICE}}
