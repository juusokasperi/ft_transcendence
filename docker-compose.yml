name: ft-transcendence-dev

volumes:
  pnpm-store: {}
  node_modules: {}
  frontend_node_modules: {}
  backend_node_modules: {}
  render_node_modules: {}
  matchmaking_node_modules: {}
  game_server_node_modules: {}
  chat_node_modules: {}


networks:
  devnet:
    driver: bridge

services:
  # 1) Install deps ONCE for the whole repo (root lockfile)
  deps:
    image: node:22-bookworm
    working_dir: /work
    environment:
      PNPM_STORE_DIR: /pnpm/store
      TMPDIR: /tmp
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: /tmp/corepack
    command: >
      bash -lc "
        corepack pnpm --version &&
        corepack pnpm install --frozen-lockfile &&
        corepack pnpm run --if-present build:libs
      "
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules
      - frontend_node_modules:/work/apps/frontend/node_modules
      - backend_node_modules:/work/apps/backend/node_modules
      - render_node_modules:/work/packages/pong/render/node_modules
      - matchmaking_node_modules:/work/apps/matchmaking/node_modules
      - game_server_node_modules:/work/apps/game-server/node_modules
    networks: [devnet]

  # 2) Frontend (Vite dev server)
  frontend:
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/frontend
    environment:
      PNPM_STORE_DIR: /pnpm/store
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: /tmp/corepack
    command: bash -lc "corepack pnpm dev"
    depends_on:
      deps:
        condition: service_completed_successfully
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules:ro
      - frontend_node_modules:/work/apps/frontend/node_modules
      - render_node_modules:/work/packages/pong/render/node_modules:ro
    networks: [devnet]
    logging: # needed for logstash (ELK stack)
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

  # 3) Backend (Fastify + tsx watch)
  backend:
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/backend
    env_file:
      - ./.env
    environment:
      PNPM_STORE_DIR: /pnpm/store
      CHOKIDAR_USEPOLLING: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: /tmp/corepack
    command: bash -lc "corepack pnpm dev"
    depends_on:
      deps:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules:ro
      - backend_node_modules:/work/apps/backend/node_modules:ro
      # sqlite data + uploads persist on host for easy inspection
      - ./apps/backend/data/sqlite:/data
      - ./apps/backend/data/sqlite/uploads:/data/uploads
    networks: [devnet]
    logging: # needed for logstash (ELK stack)
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

  # 4) Nginx (single-origin dev, optional but convenient)
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [devnet]
    logging: # needed for logstash (ELK stack)
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

# 5) Matchmaking service (WebSocket server)
  matchmaking-service:
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/matchmaking
    env_file:
      - .env
    environment:
      PNPM_STORE_DIR: /pnpm/store
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${MATCHMAKING_PORT:-4242}:4242"
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules:ro
      - matchmaking_node_modules:/work/apps/matchmaking/node_modules:ro
    command: bash -lc "corepack enable && corepack prepare pnpm@9.12.3 --activate && pnpm dev"
    depends_on:
      deps:
        condition: service_completed_successfully
    networks: [devnet]
    logging: # needed for logstash (ELK stack) #Ask Leon about this
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

# 6) Game server (WebSocket server)
  game-server:
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/game-server
    env_file:
      - .env
    environment:
      PNPM_STORE_DIR: /pnpm/store
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${GAME_SERVER_PORT:-55555}:55555"
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules:ro
      - game_server_node_modules:/work/apps/game-server/node_modules:ro
    command: bash -lc "corepack enable && corepack prepare pnpm@9.12.3 --activate && pnpm dev"
    depends_on:
      deps:
        condition: service_completed_successfully
    networks: [devnet]
    logging: # needed for logstash (ELK stack) #Ask Leon about this
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

  # 7) Chat service (WebSocket server)
  chat-service:
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/chat
    env_file:
      - .env
    environment:
      PNPM_STORE_DIR: /pnpm/store
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${CHAT_PORT:-6262}:6262"
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules:ro
      - chat_node_modules:/work/apps/chat/node_modules:ro
    command: bash -lc "corepack enable && corepack prepare pnpm@9.12.3 --activate && pnpm dev"
    depends_on:
      deps:
        condition: service_completed_successfully
    networks: [devnet]
    logging:
      driver: gelf
      options:
        gelf-address: udp://localhost:12201




include:
# stuff in this file will only run with --profile elk
  - log-management/docker-compose.yml
