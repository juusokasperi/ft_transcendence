services:
  frontend:
    build: ./client
    container_name: frontend
    ports:
      - "3001:3001"   # Vite dev server
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true  # for live reload on windows/macOS

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5173:5173"  # Fastify dev server
    volumes:
      - ./backend:/app
      - /app/node_modules
      - sqlite_data:/data   # volume for SQLite
    environment:
      - DATABASE_URL=/data/db.sqlite

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  sqlite_data: