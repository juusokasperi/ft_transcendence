name: ft-transcendence-dev

volumes:
  pnpm-store: {}
  node_modules: {}
  frontend_node_modules: {}
  backend_node_modules: {}
  render_node_modules: {}
  matchmaking_node_modules: {}
  game_server_node_modules: {}
  chat_node_modules: {}
  allocator_node_modules: {}
  scorer_node_modules: {}
  redis_data: {}
  game_gateway_node_modules: {}

networks:
  devnet:
    driver: bridge

services:
  # 1) Install deps ONCE for the whole repo (root lockfile)
  deps:
    image: node:22-bookworm
    working_dir: /work
    environment:
      PNPM_STORE_DIR: /pnpm/store
      TMPDIR: /tmp
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: /tmp/corepack
    command: >
      bash -lc "
        corepack pnpm --version &&
        corepack pnpm install --frozen-lockfile &&
        corepack pnpm run --if-present build:libs
      "
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules
      - frontend_node_modules:/work/apps/frontend/node_modules
      - backend_node_modules:/work/apps/backend/node_modules
      - render_node_modules:/work/packages/pong/render/node_modules
      - matchmaking_node_modules:/work/apps/matchmaking/node_modules
      - game_server_node_modules:/work/apps/game-server/node_modules
      - allocator_node_modules:/work/apps/allocator/node_modules
      - game_gateway_node_modules:/work/apps/game-gateway/node_modules
      - scorer_node_modules:/work/apps/scorer/node_modules
    networks: [devnet]

  # 2) Frontend (Vite dev server)
  frontend:
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/frontend
    environment:
      PNPM_STORE_DIR: /pnpm/store
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: /tmp/corepack
    command: bash -lc "corepack pnpm dev"
    depends_on:
      deps:
        condition: service_completed_successfully
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules:ro
      - frontend_node_modules:/work/apps/frontend/node_modules
      - render_node_modules:/work/packages/pong/render/node_modules:ro
    networks: [devnet]
    logging:
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

  # 3) Backend (Fastify + tsx watch)
  backend:
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/backend
    env_file:
      - ./.env
    environment:
      PNPM_STORE_DIR: /pnpm/store
      CHOKIDAR_USEPOLLING: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: /tmp/corepack
      ENABLE_SQLITE_METRICS: ${ENABLE_SQLITE_METRICS:-false}
    command: bash -lc "corepack pnpm dev"
    depends_on:
      deps:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules:ro
      - backend_node_modules:/work/apps/backend/node_modules:ro
      # sqlite data + uploads persist on host for easy inspection
      - ./apps/backend/data/sqlite:/data
      - ./apps/backend/data/sqlite/uploads:/data/uploads
    networks: [devnet]
    logging:
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

  # 4) Nginx (single-origin dev, optional but convenient)
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [devnet]
    logging:
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

  # 5) Matchmaking service (WebSocket server)
  matchmaking-service:
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/matchmaking
    env_file:
      - .env
    environment:
      PNPM_STORE_DIR: /pnpm/store
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules:ro
      - matchmaking_node_modules:/work/apps/matchmaking/node_modules:ro
    command: bash -lc "corepack enable && corepack prepare pnpm@${PNPM_VERSION:-9.12.3} --activate && pnpm dev"
    depends_on:
      deps:
        condition: service_completed_successfully
      allocator:
        condition: service_started
    networks: [devnet]
    logging:
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

  # 6a) Game server (WebSocket server) - template
  game-server: &game-server-template
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/game-server
    env_file:
      - .env
    environment:
      PNPM_STORE_DIR: /pnpm/store
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules:ro
      - game_server_node_modules:/work/apps/game-server/node_modules:ro
    command: bash -lc "corepack enable && corepack prepare pnpm@${PNPM_VERSION:-9.12.3} --activate && pnpm dev"
    depends_on:
      deps:
        condition: service_completed_successfully
    networks: [devnet]
    logging:
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

  # 6b) Game server 2 (uses same template)
  game-server-2:
    <<: *game-server-template

  # 7) Chat service (WebSocket server)
  chat-service:
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/chat
    env_file:
      - .env
    environment:
      PNPM_STORE_DIR: /pnpm/store
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules:ro
      - chat_node_modules:/work/apps/chat/node_modules:ro
    command: bash -lc "corepack enable && corepack prepare pnpm@${PNPM_VERSION:-9.12.3} --activate && pnpm dev"
    depends_on:
      deps:
        condition: service_completed_successfully
    networks: [devnet]
    logging:
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

  # 8) Allocator service (HTTP server)
  allocator:
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/allocator
    env_file:
      - .env
    environment:
      PNPM_STORE_DIR: /pnpm/store
      CHOKIDAR_USEPOLLING: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: /tmp/corepack
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules:ro
      - allocator_node_modules:/work/apps/allocator/node_modules:ro
    command: bash -lc "corepack enable && corepack prepare pnpm@${PNPM_VERSION:-9.12.3} --activate && pnpm dev"
    depends_on:
      deps:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks: [devnet]
    logging:
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

  # 9) Redis
  redis:
    image: redis:8.2.1-alpine
    init: true
    restart: unless-stopped
    networks: [devnet]
    volumes:
      - redis_data:/data
    logging:
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

  # 10) Scorer service (Updating Redis for game server load)
  scorer:
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/scorer
    env_file:
      - .env
    environment:
      PNPM_STORE_DIR: /pnpm/store
      REDIS_URL: redis://redis:6379
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules:ro
      - scorer_node_modules:/work/apps/scorer/node_modules:ro
    command: bash -lc "corepack enable && corepack prepare pnpm@${PNPM_VERSION:-9.12.3} --activate && pnpm dev"
    depends_on:
      deps:
        condition: service_completed_successfully
      redis:
        condition: service_started
      game-server:
        condition: service_started
      game-server-2:
        condition: service_started
    networks: [devnet]
    logging:
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

  # 11) Game Gateway
  game-gateway:
    image: node:22-bookworm
    init: true
    working_dir: /work/apps/game-gateway
    env_file:
      - .env
    environment:
      PNPM_STORE_DIR: /pnpm/store
      CHOKIDAR_USEPOLLING: "true"
    command: bash -lc "corepack enable && corepack prepare pnpm@${PNPM_VERSION:-9.12.3} --activate && pnpm dev"
    volumes:
      - .:/work:cached
      - pnpm-store:/pnpm/store
      - node_modules:/work/node_modules:ro
      - game_gateway_node_modules:/work/apps/game-gateway/node_modules:ro
    depends_on:
      deps:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks: [devnet]
    ports:
      - "55550:55550"

include:
  - log-management/docker-compose.yml
  - monitoring/docker-compose.yml
