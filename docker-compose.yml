# Docker Compose configuration for DEV environment
services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
      labels:
        - project=transcendence
      network: host  # to allow npm to download dependencies without proxy issues
    # container_name: dev_frontend
    env_file: .env
    ports:
      - "${FRONTEND_PORT}:5173"   # direct access: http://localhost:5173
    expose:
      - "5173"                    # for nginx upstream
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - devnet
    logging:
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      labels:
        - project=transcendence
      network: host # to allow npm to download dependencies without proxy issues
    # container_name: dev_backend
    env_file: .env
    ports:
      - "${BACKEND_PORT}:3001"  # direct access: http://localhost:3001
    expose:
      - "3001"                   # for nginx upstream
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/data/sqlite:/data       # DATABASE_PATH points into /data
      - ./backend/data/sqlite/uploads:/data/uploads # for user-uploaded files
    networks:
      - devnet
    logging:
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.dev
      labels:
        - project=transcendence
    # container_name: dev_nginx
    env_file: .env
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - devnet
    logging:
      driver: gelf
      options:
        gelf-address: udp://localhost:12201

networks:
  devnet:
    driver: bridge
    labels:
      - project=transcendence

include:
  - log-management/docker-compose.yml
